# Buddy Wallet API reverse proxy reference
#
# This configuration ensures the API receives trusted proxy metadata
# and can parse RFC 7239 Forwarded headers before legacy fallback headers.

upstream buddy_wallet_api {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name api.buddywallet.local;

    location / {
        proxy_pass http://buddy_wallet_api;

        # RFC 7239 preferred header
        proxy_set_header Forwarded "for=$remote_addr;proto=$scheme;host=$host";

        # Legacy compatibility headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Standard forwarding headers
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}
