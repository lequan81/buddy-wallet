<!doctype html>
<html lang="%paraglide.lang%" class="%theme%" data-hydrated="false">
	<!-- suppressHydrationWarning -->

	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#3B82F6" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Buddy Wallet" />
		<link rel="apple-touch-icon" href="https://s3.buddywallet.dpdns.org/buddy-wallet/public/icon/pwa-192x192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="icon" href="https://s3.buddywallet.dpdns.org/buddy-wallet/public/icon/icon.svg" type="image/svg+xml" />

		<!-- Font: Be Vietnam Pro (dns-prefetch + preconnect + load) -->
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
		<link rel="dns-prefetch" href="https://fonts.gstatic.com" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Non-render-blocking font loading (preload CSS, then swap media on load) -->
		<link
			rel="preload"
			href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			as="style"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<!-- Fallback for browsers with JS disabled -->
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
				rel="stylesheet"
			/>
		</noscript>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="global-loader" aria-hidden="true">
			<div class="global-loader__shell">
				<div class="global-loader__bar"></div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
