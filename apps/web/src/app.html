<!doctype html>
<html lang="%paraglide.lang%" class="%theme%">
	<!-- suppressHydrationWarning -->

	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#3B82F6" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Buddy Wallet" />
		<link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<!-- <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" /> -->

		<!-- Font: Be Vietnam Pro (dns-prefetch + preconnect + load) -->
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
		<link rel="dns-prefetch" href="https://fonts.gstatic.com" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Preload critical font weights (400 regular + 600 semibold) to avoid render-blocking -->
		<link
			rel="preload"
			href="https://fonts.gstatic.com/s/bevietnampro/v11/QdVPSTAyLFyeg_IDWvOJmVES_HRUBX8YYQ.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="https://fonts.gstatic.com/s/bevietnampro/v11/QdVMSTAyLFyeg_IDWvOJmVES_HT4JF8yT7wCpVFO.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<link
			href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
		/>

		<!-- API server DNS prefetch for faster first requests -->
		<link rel="dns-prefetch" href="http://localhost:3000" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
