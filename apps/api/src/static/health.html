<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddy Wallet API Health</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; background: #0b1220; color: #e2e8f0; }
    main { max-width: 920px; margin: 40px auto; padding: 24px; background: #111827; border-radius: 14px; border: 1px solid #334155; }
    h1 { margin-top: 0; }
    .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; font-weight: 700; }
    .healthy { background: #14532d; color: #86efac; }
    .degraded { background: #78350f; color: #fde68a; }
    .unhealthy { background: #7f1d1d; color: #fecaca; }
    pre { background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; overflow: auto; }
    button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Buddy Wallet API Health</h1>
    <p>Status: <span id="status" class="pill">loading...</span></p>
    <p><button onclick="refreshHealth()">Refresh</button></p>
    <pre id="json">loading...</pre>
  </main>
  <script>
    async function refreshHealth() {
      const res = await fetch('/health');
      const raw = await res.json();
      const health = raw.data || raw;
      const statusEl = document.getElementById('status');
      statusEl.textContent = health.status;
      statusEl.className = 'pill ' + (health.status || 'degraded');
      document.getElementById('json').textContent = JSON.stringify(raw, null, 2);
    }

    refreshHealth();
    setInterval(refreshHealth, 5000);
  </script>
</body>
</html>
