<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddy Wallet API Tracer</title>
  <meta http-equiv="refresh" content="5" />
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #020617;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
    }

    .v {
      font-size: 22px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0f172a;
      border: 1px solid #334155;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #1e293b;
      text-align: left;
    }

    th {
      color: #94a3b8;
    }

    .ok {
      color: #86efac;
    }

    .err {
      color: #fca5a5;
    }

    .warn {
      color: #fde68a;
    }

    a,
    button {
      color: #93c5fd;
    }

    button {
      background: transparent;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Trace Debugger</h1>
  <div class="stats">
    <div class="card">
      <div>Total</div>
      <div class="v">{{TOTAL}}</div>
    </div>
    <div class="card">
      <div>Errors</div>
      <div class="v">{{ERRORS}}</div>
    </div>
    <div class="card">
      <div>Avg ms</div>
      <div class="v">{{AVG_DURATION}}</div>
    </div>
  </div>
  <p>
    <button onclick="fetch('/debug/traces/clear', { method: 'POST' }).then(() => location.reload())">Clear
      traces</button>
    <a href="/debug/traces/json">json</a>
  </p>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Method</th>
        <th>Path</th>
        <th>Status</th>
        <th>Duration</th>
        <th>Trace ID</th>
      </tr>
    </thead>
    <tbody>
      {{TRACE_ROWS}}
    </tbody>
  </table>
</body>

</html>
